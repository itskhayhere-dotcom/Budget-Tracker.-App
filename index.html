<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6ebe1;--sf:#e9eee5;--ink:#22362a;--mut:#74877a;--gr:#5d8264;--gr2:#7fa385;--well:#e2e8dd;
--up:9px 9px 20px #c2cabc,-8px -8px 18px #fbfdf7;--up-s:5px 5px 11px #c6cdc0,-4px -4px 10px #fafcf6;--in:inset 5px 5px 10px #c7cec1,inset -5px -5px 10px #f8faf3;
--serif:"Cormorant Garamond",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(circle at 20% 0,#f0f4ec,var(--bg) 60%);color:var(--ink);font:14px/1.4 var(--sans);min-height:100vh;padding-bottom:calc(128px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
.leaf{position:fixed;pointer-events:none;z-index:0;opacity:.45;width:190px}.l1{top:-20px;right:-40px;transform:scaleX(-1) rotate(10deg)}.l2{top:90px;left:-70px;transform:rotate(25deg);opacity:.3}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:18px 16px}
.hd{position:relative;text-align:center;margin-bottom:16px;padding:0 48px}
h1{font:600 clamp(28px,7vw,40px)/1 var(--serif);letter-spacing:.08em;margin:0;text-transform:uppercase}
.hd p{margin:6px 0 0;font-size:10px;letter-spacing:.32em;color:var(--mut);text-transform:uppercase}
.hd p.hello{letter-spacing:0;text-transform:none;font-size:13px;color:var(--gr);margin-top:8px;line-height:1.4}
.gear{position:absolute;right:0;top:0;width:42px;height:42px;border-radius:50%;border:0;background:var(--sf);box-shadow:var(--up-s);color:var(--gr);font-size:18px;cursor:pointer}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.card{position:relative;background:var(--sf);border-radius:30px;box-shadow:var(--up);padding:18px;min-width:0}
.card h2{font:600 22px/1 var(--serif);margin:0 0 14px}
.card.slim{padding:10px 14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 4px 0}
.ph h2{font:600 28px/1 var(--serif);margin:0}
.xl{min-height:40px;border:0;border-radius:16px;background:var(--sf);box-shadow:var(--up-s);padding:0 14px;font:600 12px var(--sans);color:var(--gr);cursor:pointer;white-space:nowrap}
.xl:disabled{opacity:.6}
.big{font:600 40px/1 var(--serif);letter-spacing:.02em}
.t{margin:6px 0;font-size:13px;line-height:1.5}.mut{color:var(--mut)}
.s2{font-size:12px;color:var(--mut);margin:12px 0 4px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.stat{background:var(--well);box-shadow:var(--in);border-radius:20px;padding:14px;min-width:0}
.stat small{display:block;color:var(--mut);font-size:11px;margin-bottom:4px}
.stat b{font:600 22px var(--serif);overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:10px;width:100%;background:var(--sf);box-shadow:var(--up-s);border-radius:18px;padding:11px 12px;margin-bottom:11px;color:var(--ink);min-height:48px}
.row.done{box-shadow:var(--in);background:var(--well)}.row.done .nm{color:var(--mut);text-decoration:line-through}
.rmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.nm{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.sub{display:block;font-size:11px;color:var(--mut);margin-top:2px;line-height:1.35}
.amt{font:600 16px var(--serif);white-space:nowrap}.amt.p{color:var(--gr)}
.ck{width:26px;height:26px;border-radius:50%;box-shadow:var(--in);background:var(--well);display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.row.done .ck{background:var(--gr);box-shadow:var(--up-s)}
.ed{width:34px;height:34px;border-radius:50%;border:0;background:var(--sf);box-shadow:var(--up-s);color:var(--mut);cursor:pointer;font-size:12px;flex:none}
.pg{display:block;height:9px;border-radius:6px;background:var(--well);box-shadow:var(--in);overflow:hidden;margin-top:7px;position:relative}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#8fb094,#52775a);border-radius:6px}
.pg.ms::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 24.4%,#e9eee5 24.4% 25.6%,transparent 25.6% 49.4%,#e9eee5 49.4% 50.6%,transparent 50.6% 74.4%,#e9eee5 74.4% 75.6%,transparent 75.6%)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button,.chips a{min-height:38px;border:0;border-radius:14px;background:var(--sf);box-shadow:var(--up-s);padding:0 13px;font:500 12px var(--sans);color:var(--ink);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--well);box-shadow:var(--in);color:var(--gr)}
.pbtn{width:100%;min-height:46px;border:0;border-radius:16px;background:linear-gradient(145deg,#76a07d,#52775a);color:#fff;font:600 13px var(--sans);padding:0 18px;box-shadow:var(--up-s);cursor:pointer;margin-top:10px}
.add{display:flex;gap:8px;margin-top:4px}
.add input,.sheet input,.sheet select,.card textarea,.sheet textarea,.card select,.card input[type=search]{width:100%;min-height:42px;border:0;background:var(--well);box-shadow:var(--in);border-radius:16px;padding:11px 14px;font:inherit;color:var(--ink)}
.add button{min-width:64px;border:0;border-radius:16px;background:linear-gradient(145deg,#76a07d,#52775a);color:#fff;font:600 13px var(--sans);padding:0 16px;box-shadow:var(--up-s);cursor:pointer}
.card textarea,.sheet textarea{min-height:76px;resize:vertical;margin-top:4px}
.fl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.seg{display:flex;gap:6px;background:var(--well);box-shadow:var(--in);border-radius:18px;padding:5px;margin-top:12px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:14px;font:600 12px var(--sans);color:var(--mut);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--sf);box-shadow:var(--up-s);color:var(--gr)}
.msel{display:flex;align-items:center;justify-content:space-between}
.msel button{width:44px;height:44px;border:0;border-radius:50%;background:var(--sf);box-shadow:var(--up-s);color:var(--gr);font-size:20px;cursor:pointer}
.msel button:disabled{opacity:.4}.msel b{font:600 22px var(--serif)}
.ring{position:relative;width:min(210px,62vw);aspect-ratio:1;border-radius:50%;box-shadow:var(--up);background:var(--sf);margin:8px auto 14px;flex:none}
.ring::before{content:"";position:absolute;inset:8%;border-radius:50%;box-shadow:var(--in);background:var(--well)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}.ring .tr{stroke:#cfd8cb}.ring .pr{stroke:var(--gr2);stroke-linecap:round;transition:stroke-dashoffset .9s}
.tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20%}
.tm b{font:600 40px/1 var(--serif);letter-spacing:.02em}.tm span{font-size:12px;color:var(--mut);margin-top:5px;line-height:1.3}
.two{display:flex;justify-content:space-between;gap:10px}.two b{display:block;font:600 24px var(--serif)}.two span{font-size:12px;color:var(--mut)}.two .r{text-align:right}
.dwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.dn{position:relative;width:min(170px,52vw);aspect-ratio:1;flex:none}.dn svg{width:100%;height:100%;transform:rotate(-90deg)}
.dn .tm{padding:0 26%}.dn .tm b{font-size:22px}
.leg{flex:1;min-width:150px;font-size:12px}.leg div{display:flex;align-items:center;gap:7px;padding:3px 0}.leg i{width:9px;height:9px;border-radius:50%;flex:none}.leg span{flex:1}.leg b{font-weight:600}
.bars{display:flex;justify-content:space-between;gap:6px;height:150px;background:var(--well);box-shadow:var(--in);border-radius:20px;padding:14px 10px 8px;margin-top:8px}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:30px;border-radius:8px;background:linear-gradient(#9dbf9f,#7fa385);box-shadow:var(--up-s);min-height:5px}
.bar.t i{background:linear-gradient(#6b9573,#4f7557)}.bar span{font-size:8px;letter-spacing:.1em;color:var(--mut)}
.chart{width:100%;height:auto;display:block;background:var(--well);box-shadow:var(--in);border-radius:20px}
.hb{margin:12px 0}.hr{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.cal7{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:8px 0}
.cal7 span.h{font-size:10px;color:var(--mut);text-align:center}
.cd,.cal button{aspect-ratio:1;min-height:34px;border:0;border-radius:12px;background:var(--sf);box-shadow:var(--up-s);color:var(--mut);font:600 12px var(--sans);cursor:pointer;position:relative;padding:0}
.cd.part{background:var(--well);box-shadow:var(--in);color:var(--gr)}
.cd.full,.cal button[aria-pressed=true]{background:var(--gr);box-shadow:var(--in);color:#fff}
.cd.td{outline:2px solid var(--gr2);outline-offset:2px}
.cd.ns::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#c9a96e}
.cd:disabled{opacity:.35}
.cal{display:grid;gap:7px;margin:10px 0}
.badge{display:inline-block;border-radius:12px;padding:5px 10px;font-size:11px;margin:0 6px 6px 0;background:var(--well);box-shadow:var(--in);color:var(--mut)}.badge.on{background:var(--gr);color:#fff}
details.dt{margin-top:10px}details.dt summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font:600 13px var(--sans);color:var(--gr)}
.gh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid #d3dccf}.gh b{font:600 16px var(--serif)}
.eye{position:absolute;top:14px;right:14px;min-height:34px;border:0;border-radius:14px;background:var(--sf);box-shadow:var(--up-s);padding:0 12px;font:600 11px var(--sans);color:var(--gr);cursor:pointer}
.sprig{position:absolute;right:10px;top:8px;width:70px;opacity:.5;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(210,220,205,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;z-index:10;padding:18px}
.sheet{width:min(400px,100%);max-height:calc(100vh - 36px);overflow-y:auto;background:var(--sf);box-shadow:var(--up);border-radius:30px;padding:22px}
.sheet h2{font:600 22px/1 var(--serif);margin:0}.sheet label{display:block;font-size:12px;color:var(--mut);margin:14px 0 6px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.acts button{flex:1 1 40%;min-height:44px;border:0;border-radius:16px;padding:0 6px;font:600 13px var(--sans);cursor:pointer;background:var(--sf);box-shadow:var(--up-s);color:var(--ink)}
.acts .sv{background:linear-gradient(145deg,#76a07d,#52775a);color:#fff}.acts .dl{color:#a4594b}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));display:flex;background:var(--sf);box-shadow:var(--up);border-radius:26px;padding:6px;z-index:4}
.tabs button{flex:1;min-height:52px;border:0;background:transparent;border-radius:20px;padding:7px 0 6px;color:var(--mut);font:500 9px var(--sans);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button b{font-size:18px;font-weight:400;line-height:1}.tabs button.on{box-shadow:var(--in);background:var(--well);color:var(--gr)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--sf);box-shadow:var(--up);padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;z-index:12;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v3 polish ---- */
.stat b{white-space:nowrap}.stat small{line-height:1.25}
.deco .leaf path:first-child{display:none}
.deco .leaf{opacity:.4!important}
.deco{position:absolute;left:0;right:0;top:0;height:340px;overflow:hidden;pointer-events:none;z-index:0}
html,body{overflow-x:hidden}
body{position:relative;background:radial-gradient(120% 55% at 12% 0,#f4f8ef 0,transparent 62%),radial-gradient(90% 45% at 100% 18%,#e8efe2 0,transparent 58%),var(--bg)}
.leaf{position:absolute;z-index:0;pointer-events:none}.l1{top:-14px;right:-38px;width:220px;opacity:.55;transform:scaleX(-1) rotate(8deg)}.l2{top:-6px;left:-58px;width:210px;opacity:.5;transform:rotate(38deg) scaleX(-1)}
.card{background:linear-gradient(160deg,#eef3ea,#e3e9de);border:1px solid rgba(255,255,255,.6);border-radius:32px}
.card h2{font-size:24px;letter-spacing:.01em}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gear .ic{width:20px;height:20px}
.tabs{background:linear-gradient(160deg,#eef3ea,#e2e8dd)}.tabs button .ic{width:23px;height:23px}.tabs button.on .ic{stroke-width:2}
.it{width:42px;height:42px;border-radius:14px;background:var(--sf);box-shadow:var(--up-s);display:grid;place-items:center;color:var(--gr);flex:none}.it.round{width:52px;height:52px;border-radius:50%}
.row .it{width:40px;height:40px;background:var(--well);box-shadow:var(--in)}
.row{border-radius:20px}
.chev{color:var(--mut);display:grid;place-items:center;flex:none}.chev .ic{width:16px;height:16px}
.amt.x{color:#b0675a}.amt.p{color:var(--gr)}
.stat.ic2{display:flex;align-items:center;gap:10px}.stat.ic2>div{min-width:0}.stat.ic2 .it{width:38px;height:38px;border-radius:12px}
.pill{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:14px;background:var(--well);box-shadow:var(--in);font-size:11px;color:var(--gr)}
.big.hero{font-size:46px;margin-top:4px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;font:500 11px/1.25 var(--sans);color:var(--ink);cursor:pointer;padding:4px 0;min-height:48px;text-align:center}
.ringwrap{position:relative;display:flex;justify-content:center;align-items:center}
.lf{position:absolute;width:62px;top:20%;fill:none;stroke:#7fa385;stroke-width:1.5;opacity:.6;pointer-events:none}
.lf.a{left:0;transform:rotate(-8deg)}.lf.b{right:0;transform:scaleX(-1) rotate(-8deg)}
.dwrap .ring{width:min(172px,46vw)}.dwrap .ringwrap .lf{width:48px}
.jump{display:flex;gap:8px;overflow-x:auto;padding:5px;background:var(--well);box-shadow:var(--in);border-radius:20px;scrollbar-width:none}.jump::-webkit-scrollbar{display:none}
.jump button{flex:1 0 auto;min-height:40px;border:0;border-radius:16px;padding:0 16px;background:var(--sf);box-shadow:var(--up-s);font:600 12px var(--sans);color:var(--gr);cursor:pointer}
.card[id]{scroll-margin-top:14px}
.card.quote{position:relative;overflow:hidden;background:linear-gradient(160deg,#e9f0e4,#dde6d7)}
.qt2{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.qt2>.ic{width:36px;height:36px;color:var(--gr)}
.qt2 b{display:block;font:600 22px var(--serif)}.qt2 span{font:italic 500 17px/1.3 var(--serif);color:#44604b}
.qt2.big{justify-content:center;text-align:center;padding:16px 36px}.qt2.big span{font-size:23px}
.card.qg .lf{top:10%;width:56px}
.wk{display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;height:84px;flex:1;min-width:120px}
.wk .b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;width:16px}
.wk .b i{display:block;width:100%;border-radius:6px;background:var(--well);box-shadow:var(--in)}.wk .b i.on{background:linear-gradient(#8fb094,#52775a);box-shadow:var(--up-s)}.wk .b span{font-size:8px;color:var(--mut)}
.cnt{float:right;font:500 12px var(--sans);color:var(--mut);margin-top:8px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.enter>*{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.3s}
.ring .pr{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)}
@media(prefers-reduced-motion:reduce){.enter>*{animation:none}}

/* ---- v4: standard fonts, raised buttons, full-colour botanicals ---- */
:root{--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--serif:"Newsreader","Times New Roman",Times,serif;--up-s:6px 6px 14px #bcc6b6,-5px -5px 12px #fcfef9;--btn:linear-gradient(145deg,#f7fbf3,#e0e8db);--btng:linear-gradient(145deg,#7aa582,#4f7557)}
body{font-variant-numeric:lining-nums}button,input,select,textarea{font-family:var(--sans)}
h1{font-weight:500;letter-spacing:.14em}.big,.two b,.stat b,.ph h2,.card h2,.sheet h2,.tm b,.msel b,.qt2 b{letter-spacing:.01em;font-variant-numeric:lining-nums}
.gh b,.leg b{font-family:var(--sans);font-weight:600}

.tabs button.on{background:var(--btn);box-shadow:var(--up-s);color:var(--gr)}
.tabs button.on::after{content:"";width:18px;height:3px;border-radius:2px;background:var(--gr)}
.chips button,.xl,.jump button,.ed,.eye,.msel button,.cal button,.cd,.seg button,.acts button,.qa .it,.it,.stat,.pill,.badge,.ck,.row,.row.done,.row .it{background:var(--btn);box-shadow:var(--up-s)}
.chips button[aria-pressed=true],.seg button[aria-pressed=true],.cal button[aria-pressed=true],.cd.full,.badge.on,.row.done .ck{background:var(--btng);box-shadow:var(--up-s);color:#fff}
.acts .sv{background:var(--btng);color:#fff}
.seg,.jump{background:none;box-shadow:none;padding:2px;gap:10px}
.cd.part{background:linear-gradient(145deg,#e8f1e3,#cfdfc9);color:var(--gr)}
.wk .b i{background:#d4ded0;box-shadow:none}.wk .b i.on{background:linear-gradient(#8fb094,#4f7557);box-shadow:var(--up-s)}

.card h2{line-height:1.15}
.card>.lf{top:12px;right:12px;width:58px}
.card.quote .lf{top:6px}

<script>
(function(){
"use strict";
const CATS=["Housing","Food","Transportation","Bills","Shopping","Health","Fun","Other"],CURS=["₹","AED","OMR","$"];
const ATYPES=["Cash and bank","Savings and deposits","Investments","Property","Vehicle","Gold and valuables","Other"];
const SUBS={Housing:["Rent","Mortgage","Repairs","Furniture and decor","Other housing"],Food:["Groceries","Dining out","Coffee and snacks","Food delivery","Other food"],Transportation:["Petrol","Bus","Metro or train","Taxi or ride-hailing","Parking and tolls","Vehicle service","Other transport"],Bills:["Electricity","Water","Internet","Phone","Insurance","Subscriptions","Other bills"],Shopping:["Clothes","Shoes and accessories","Electronics","Home items","Beauty and personal care","Gifts","Online orders","Other shopping"],Health:["Medicine","Doctor visits","Gym and fitness","Other health"],Fun:["Movies and events","Travel and trips","Hobbies","Games","Other fun"],Other:["Education","Donations","Family support","Miscellaneous"]};
const PAL={Housing:"#52775a",Food:"#8fb094",Transportation:"#c9a96e",Bills:"#7f9aa3",Shopping:"#b4745f",Health:"#9a8fb0",Fun:"#d9c7a0",Other:"#a6b59f"};
const TABS=[["home","home","Home"],["money","wallet","Money"],["goals","target","Goals"],["habits","calcheck","Habits"],["insights","bars","Insights"]];
const HELLO={money:"Every entry is a step. Small and steady wins.",goals:"Make it clear, then make it happen.",habits:"Discipline today, freedom tomorrow.",insights:"You don’t need more money. You need a better plan.",settings:"Your data, your rules."};
const $=i=>document.getElementById(i);
const EM={"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"};
const ex=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>EM[c]);
const uid=()=>Date.now()+Math.floor(Math.random()*1000);
const iso=d=>{d=d||new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)};
const ym=k=>(k||iso()).slice(0,7);
const mshift=(m,n)=>{const a=m.split("-");return iso(new Date(+a[0],+a[1]-1+n,15)).slice(0,7)};
const mrange=(n,end)=>{const r=[];for(let i=n-1;i>=0;i--)r.push(mshift(end,-i));return r};
const mlab=m=>new Date(m+"-15").toLocaleDateString(undefined,{month:"long",year:"numeric"});
const mshort=m=>new Date(m+"-15").toLocaleDateString(undefined,{month:"short"});
const lab=k=>new Date(k+"T00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
const daysIn=m=>{const a=m.split("-");return new Date(+a[0],+a[1],0).getDate()};
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const A$=x=>x.amt;

/* ---------- state ---------- */
function normalize(o){
 const D={cur:"₹",tab:"home",tx:[],bud:{},goals:[],debts:[],assets:[],contrib:[],nw:{},habits:null,hlog:{},ci:{},ns:{},ch:[],g30:[],refl:{},strat:"snow",hide:false};
 for(const k in D)if(o[k]===undefined||o[k]===null)o[k]=JSON.parse(JSON.stringify(D[k]));
 (o.inc||[]).forEach(x=>o.tx.push({id:x.id,type:"income",date:x.date,cat:"Income",sub:"",note:x.src,amt:x.amt}));
 (o.exp||[]).forEach(x=>o.tx.push({id:x.id,type:"expense",date:x.date,cat:x.cat,sub:x.sub||"",note:x.note||"",amt:x.amt}));
 delete o.inc;delete o.exp;
 o.tx.forEach(x=>{if(x.cat==="Transport")x.cat="Transportation"});
 if(o.bud.Transport){o.bud.Transportation=o.bud.Transport;delete o.bud.Transport}
 o.assets.forEach(a=>{if(!a.type)a.type="Other"});
 if(o.rs){if(Object.keys(o.rs.done||{}).length&&!o.ch.length)o.ch.push({id:uid(),name:"30-day money reset",days:30,start:o.rs.start,done:o.rs.done});delete o.rs}
 if(o.v!==2){o.nw={};o.v=2}
 if(!Array.isArray(o.habits))o.habits=["Track expenses","Check budget","10 min financial reflection","No impulse buys"].map((n,i)=>({id:i+1,name:n}));
 if(["home","money","goals","habits","insights","settings"].indexOf(o.tab)<0)o.tab="home";
 return o}
let S=null;try{S=JSON.parse(localStorage.getItem("mossfin"))}catch(e){}
S=normalize(S&&typeof S==="object"?S:{});
const save=()=>{try{localStorage.setItem("mossfin",JSON.stringify(S))}catch(e){}};
const U={mon:ym(),cm:ym(),q:"",tf:"all",tc:"all",mv:"m",rg:"6",nwo:false};
const fm=n=>{const v=Math.round(Number(n)||0);return(v<0?"-":"")+S.cur+Math.abs(v).toLocaleString()};
const sgn=x=>(x.type==="income"?"+":"-")+fm(x.amt);
let tt;const toast=m=>{const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200)};

/* ---------- single source of truth: calculations ---------- */
const txs=(type,m)=>S.tx.filter(x=>(!type||x.type===type)&&(!m||ym(x.date)===m));
const incM=m=>sum(txs("income",m),A$),expM=m=>sum(txs("expense",m),A$);
const savedM=m=>sum(S.contrib.filter(c=>ym(c.date)===m),A$);
const spendM=m=>incM(m)-savedM(m),leftM=m=>spendM(m)-expM(m),unspentM=leftM;
const budTotal=()=>sum(Object.keys(S.bud),k=>S.bud[k]);
const assetsT=()=>sum(S.assets,A$),debtT=()=>sum(S.debts,d=>d.bal),netW=()=>assetsT()-debtT();
const cashT=()=>sum(S.assets.filter(a=>a.type==="Cash and bank"),A$);
const liquidT=()=>sum(S.assets.filter(a=>a.type==="Cash and bank"||a.type==="Savings and deposits"),A$);
const gSaved=()=>sum(S.goals,g=>g.saved),gTarget=()=>sum(S.goals,g=>g.target);
function byCat(l){const m={};l.filter(x=>x.type==="expense").forEach(x=>{m[x.cat]=(m[x.cat]||0)+x.amt});return CATS.map(c=>({k:c,v:m[c]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v)}
function bySub(l,c){const m={};l.filter(x=>x.type==="expense"&&x.cat===c).forEach(x=>{const k=x.sub||"Other";m[k]=(m[k]||0)+x.amt});return Object.keys(m).map(k=>({k:k,v:m[k]})).sort((a,b)=>b.v-a.v)}
const brk=(l,c)=>bySub(l,c).map(x=>ex(x.k)+" "+fm(x.v)).join(" · ");
function payoff(d){if(d.bal<=0)return{done:1};if(!(d.pay>0))return{na:"Add a monthly payment to estimate a payoff date."};const r=(d.rate||0)/1200;let b=d.bal,n=0;while(b>0&&n<600){const i=b*r;if(d.pay<=i)return{na:"The payment doesn’t cover the monthly interest yet. Raise it to see a payoff date."};b=b+i-d.pay;n++}if(n>=600)return{na:"More than 50 years at this payment."};const dt=new Date();dt.setMonth(dt.getMonth()+n);return{n:n,date:dt}}
const dstr=d=>d.toLocaleDateString(undefined,{month:"short",year:"numeric"});
const hDone=k=>S.habits.filter(h=>S.hlog[k]&&S.hlog[k][h.id]).length;
function streaks(){const keys=Object.keys(S.ci).filter(k=>S.ci[k]).sort();let cur=0,o=S.ci[iso()]?0:1;const dk=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};while(S.ci[dk(o)]){cur++;o++}
 let best=0,run=0,prev=null;keys.forEach(k=>{const a=k.split("-"),t=Date.UTC(+a[0],+a[1]-1,+a[2]);run=prev!==null&&t-prev===864e5?run+1:1;prev=t;if(run>best)best=run});return{cur:cur,best:best,total:keys.length}}
const rangeMonths=r=>{const now=ym();if(r==="3")return mrange(3,now);if(r==="year")return mrange(+now.slice(5),now);if(r==="all"){const ms=S.tx.map(x=>ym(x.date)).sort();return ms.length?mrange(Math.min(36,(+now.slice(0,4)-+ms[0].slice(0,4))*12+(+now.slice(5)-+ms[0].slice(5))+1),now):[now]}return mrange(6,now)};

/* ---------- ui primitives ---------- */
function modal(t,fs,bs,note,cl){$("mt").textContent=t;let h=note?`<p class="t">${note}</p>`:"";
 fs.forEach(x=>{const id="f_"+x.k,l=`<label for="${id}">${x.l}</label>`,v=x.v==null?"":x.v;
  h+=x.t==="sel"?l+`<select id="${id}">${x.o.map(o=>`<option${o===v?" selected":""}>${ex(o)}</option>`).join("")}</select>`:x.t==="area"?l+`<textarea id="${id}">${ex(v)}</textarea>`:l+`<input id="${id}" type="${x.t==="date"?"date":x.t==="num"?"number":"text"}"${x.t==="num"?' step="any" min="0" inputmode="decimal"':' maxlength="80"'} value="${ex(v)}">`});
 $("mb").innerHTML=h;
 fs.forEach(x=>{if(x.dep)$("f_"+x.dep).addEventListener("change",function(){$("f_"+x.k).innerHTML=(x.map[this.value]||[]).map(o=>`<option>${ex(o)}</option>`).join("")})});
 const A=$("ma");A.innerHTML="";
 bs.concat([{t:cl||"Cancel",f:()=>{}}]).forEach(b=>{const e=document.createElement("button");e.type="button";if(b.c)e.className=b.c;e.textContent=b.t;e.onclick=()=>{const v={};fs.forEach(x=>{v[x.k]=$("f_"+x.k).value.trim()});if(b.f(v)!==false)$("md").classList.add("hide")};A.appendChild(e)});
 $("md").classList.remove("hide");const i=$("mb").querySelector("input,textarea");if(i)i.focus()}
$("md").addEventListener("click",e=>{if(e.target===$("md"))$("md").classList.add("hide")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("md").classList.add("hide")});
const bad=()=>{toast("Please check the name and amount");return false};
const done=()=>{save();render()};
const card=(h,b,x)=>`<section class="card${x||""}">${h?`<h2>${h}</h2>`:""}${b}</section>`;
const ico=n=>`<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const CI={Housing:"home",Food:"fork",Transportation:"bus",Bills:"doc",Shopping:"bag",Health:"heart",Fun:"film",Other:"dots",Income:"sprout"};
const QUOTES=["Small steps today, bigger freedom tomorrow.","You don’t need more money. You need a better plan.","Discipline today, freedom tomorrow.","Plan. Track. Grow."];
const leaf=c=>`<svg class="lf ${c}" viewBox="0 0 100 140" aria-hidden="true"><use href="#bot-sprig"/></svg>`;
const jump=l=>`<div class="jump" role="navigation" aria-label="Jump to section">${l.map(x=>`<button type="button" data-a="jump" data-id="${x[0]}">${x[1]}</button>`).join("")}</div>`;

function animRings(){if(!U.anim||(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches))return;document.querySelectorAll("#main .pr").forEach(e=>{const t=e.getAttribute("stroke-dashoffset");e.style.transition="none";e.style.strokeDashoffset="326.7";void e.getBoundingClientRect();e.style.transition="";requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.strokeDashoffset=t}))})}

function donut(items,center,small){const T=sum(items,x=>x.v);if(!T)return`<p class="t mut">No spending recorded for this period yet.</p>`;const R=42,C=2*Math.PI*R;let off=0,s=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="#e2e8dd" stroke-width="14"/>`;
 items.forEach(x=>{const l=x.v/T*C;s+=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${PAL[x.k]||"#a6b59f"}" stroke-width="14" stroke-dasharray="${l.toFixed(2)} ${(C-l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=l});
 return`<div class="dwrap"><div class="dn" role="img" aria-label="Spending distribution, total ${ex(fm(T))}"><svg viewBox="0 0 120 120">${s}</svg><div class="tm"><b>${center}</b><span>${small}</span></div></div><div class="leg">${items.map(x=>`<div><i style="background:${PAL[x.k]||"#a6b59f"}"></i><span>${ex(x.k)}</span><b>${Math.round(x.v/T*100)}%</b></div>`).join("")}</div></div>`}
function area(ms,I,E){const W=300,H=150,pl=10,pr=10,pt=14,pb=24,mx=Math.max(1,...I,...E),X=i=>pl+(ms.length<2?(W-pl-pr)/2:i*(W-pl-pr)/(ms.length-1)),Y=v=>pt+(H-pt-pb)*(1-v/mx);
 const path=a=>a.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" "),ar=a=>path(a)+` L${X(a.length-1).toFixed(1)} ${H-pb} L${X(0).toFixed(1)} ${H-pb} Z`;
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income versus expenses by month"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#52775a" stop-opacity=".35"/><stop offset="1" stop-color="#52775a" stop-opacity="0"/></linearGradient><linearGradient id="ge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9a96e" stop-opacity=".35"/><stop offset="1" stop-color="#c9a96e" stop-opacity="0"/></linearGradient></defs><line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#cfd8cb"/><line x1="${pl}" x2="${W-pr}" y1="${pt}" y2="${pt}" stroke="#d8e0d4" stroke-dasharray="3 4"/><text x="${pl}" y="${pt-3}" font-size="8" fill="#74877a">${ex(fm(mx))}</text>
 <path d="${ar(I)}" fill="url(#gi)"/><path d="${ar(E)}" fill="url(#ge)"/><path d="${path(I)}" fill="none" stroke="#52775a" stroke-width="2"/><path d="${path(E)}" fill="none" stroke="#c9a96e" stroke-width="2"/>
 ${ms.map((m,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(I[i]).toFixed(1)}" r="2.6" fill="#52775a"/><circle cx="${X(i).toFixed(1)}" cy="${Y(E[i]).toFixed(1)}" r="2.6" fill="#c9a96e"/><text x="${X(i).toFixed(1)}" y="${H-8}" font-size="8" text-anchor="middle" fill="#74877a">${mshort(m)}</text>`).join("")}</svg><div class="chips" style="margin:6px 0 0"><span class="badge on">Income</span><span class="badge" style="background:#c9a96e;color:#fff;box-shadow:none">Expenses</span></div>`}

/* ---------- add / edit ---------- */
const ENT={
inc:{arr:"tx",title:"income",fs:[{k:"note",l:"Source (for example: salary)",t:"text",req:1},{k:"amt",l:"Amount",t:"num",pos:1},{k:"date",l:"Date",t:"date"}],def:()=>({type:"income",cat:"Income",sub:"",date:iso()})},
exp:{arr:"tx",title:"expense",fs:[{k:"cat",l:"Category",t:"sel",o:CATS},{k:"sub",l:"What kind?",t:"sel",o:SUBS.Food,dep:"cat",map:SUBS},{k:"note",l:"Details (optional)",t:"text"},{k:"amt",l:"Amount",t:"num",pos:1},{k:"date",l:"Date",t:"date"}],def:()=>({type:"expense",cat:"Food",sub:"Groceries",date:iso()})},
asset:{arr:"assets",title:"asset",fs:[{k:"type",l:"Type",t:"sel",o:ATYPES},{k:"name",l:"Name (for example: bank account, gold chain)",t:"text",req:1},{k:"amt",l:"Current value",t:"num"}],def:()=>({type:ATYPES[0],amt:0})},
goal:{arr:"goals",title:"savings goal",fs:[{k:"name",l:"Goal",t:"text",req:1},{k:"target",l:"Target amount",t:"num",pos:1},{k:"saved",l:"Already saved before (not taken from this month’s income)",t:"num"}],def:()=>({saved:0}),extraNew:1,extra:[{k:"add",l:"Set aside now from this month’s income",t:"num"}],after:(it,v)=>{const a=+v.add||0;if(a>0){it.saved+=a;S.contrib.push({date:iso(),amt:a,goal:it.name})}}},
debt:{arr:"debts",title:"debt",fs:[{k:"name",l:"Debt",t:"text",req:1},{k:"bal",l:"Balance left",t:"num"},{k:"pay",l:"Monthly payment",t:"num"},{k:"rate",l:"Interest rate % per year (optional)",t:"num"}],def:()=>({pay:0,rate:0}),extra:[{k:"paid",l:"Log a payment",t:"num"}],after:(it,v,nw)=>{if(nw||!it.start)it.start=it.bal;const p=+v.paid||0;if(p>0)it.bal=Math.max(0,it.bal-p);it.start=Math.max(it.start,it.bal)}},
habit:{arr:"habits",title:"habit",fs:[{k:"name",l:"Habit",t:"text",req:1}],def:()=>({})}};
function open(key,id){const E=ENT[key],arr=S[E.arr],it=id?arr.filter(x=>String(x.id)===id)[0]:null,nw=!it,item=it||Object.assign({id:uid()},E.def());
 let fs=E.fs.map(x=>Object.assign({},x,{v:item[x.k]},x.dep?{o:SUBS[item[x.dep]]||x.o}:{}));if((!nw||E.extraNew)&&E.extra)fs=fs.concat(E.extra);
 modal((nw?"Add ":"Edit ")+E.title,fs,[{t:"Save",c:"sv",f:v=>{
  for(const x of E.fs){const s=v[x.k];if(x.req&&!s)return bad();if(x.t==="num"){const n=+s;if(!isFinite(n)||n<0||(x.pos&&!(n>0)))return bad()}}
  E.fs.forEach(x=>{item[x.k]=x.t==="num"?+v[x.k]:(x.t==="date"&&!v[x.k]?iso():v[x.k])});if(E.after)E.after(item,v,nw);if(nw)arr.push(item);done()}}].concat(nw?[]:[{t:"Delete",c:"dl",f:()=>{S[E.arr]=arr.filter(x=>x!==item);done()}}]))}
const edit=id=>{const x=S.tx.filter(t=>String(t.id)===id)[0];if(x)open(x.type==="income"?"inc":"exp",id)};
function addTx(){modal("Add a transaction",[],[{t:"Expense",c:"sv",f:()=>{setTimeout(()=>open("exp"),0)}},{t:"Income",f:()=>{setTimeout(()=>open("inc"),0)}}],"What would you like to add?")}
function transfer(){if(!S.goals.length)return toast("Create a savings goal first");modal("Transfer to savings",[{k:"g",l:"Goal",t:"sel",o:S.goals.map(g=>g.name)},{k:"a",l:"Amount",t:"num"}],[{t:"Transfer",c:"sv",f:v=>{const a=+v.a,g=S.goals.filter(x=>x.name===v.g)[0];if(!g||!(a>0))return bad();g.saved+=a;S.contrib.push({date:iso(),amt:a,goal:g.name});done()}}],"This sets money aside for the goal and takes it out of this month’s spendable income. It isn’t an expense, and your net worth doesn’t change.")}

/* ---------- transactions list (search + filters) ---------- */
function txList(){const q=U.q.trim().toLowerCase();return txs(null,U.mon).filter(x=>(U.tf==="all"||x.type===U.tf)&&(U.tc==="all"||x.cat===U.tc)&&(!q||(x.note+" "+x.cat+" "+x.sub+" "+x.amt).toLowerCase().indexOf(q)>-1)).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:b.id-a.id)}
const txRow=x=>row("etx",x.id,x.note||x.sub||x.cat,(x.type==="income"?"Income":ex(x.cat)+(x.sub?" › "+ex(x.sub):""))+" · "+lab(x.date),sgn(x),null,0,CI[x.cat]||"dots",x.type==="income"?"p":"x");
function txBody(){const L=txList();return`<p class="s2" style="margin-top:0">${L.length} ${L.length===1?"transaction":"transactions"} · Income ${fm(sum(L.filter(x=>x.type==="income"),A$))} · Expenses ${fm(sum(L.filter(x=>x.type==="expense"),A$))}</p>`+(L.length?L.map(txRow).join(""):`<p class="t mut">${txs(null,U.mon).length?"Nothing matches your search or filters.":"No transactions in "+mlab(U.mon)+" yet."}</p>`)}
const refreshTx=()=>{const e=$("txl");if(e)e.innerHTML=txBody()};

const cQuote=()=>{const h=new Date().getHours();return card("",`<div class="qt2">${ico("sprout")}<div><b>${h<12?"Good morning":h<18?"Good afternoon":"Good evening"}</b><span>“${QUOTES[new Date().getDate()%QUOTES.length]}”</span></div></div>`+leaf("b")," quote")};
function cNW(){const A=assetsT(),L=debtT(),N=A-L,ks=Object.keys(S.nw).filter(k=>k<ym()).sort(),pv=ks.length?S.nw[ks[ks.length-1]]:null,M=n=>S.hide?"••••":fm(n),gs=gSaved(),lq=liquidT(),df=pv===null?null:N-pv;
 return card("Net worth",`<button type="button" class="eye" data-a="eye" aria-pressed="${S.hide}">${S.hide?"Show":"Hide"}</button><div class="big hero">${M(N)}</div>${df===null?'<span class="pill">First monthly snapshot saved automatically</span>':`<span class="pill">${df>=0?"▲":"▼"} ${S.hide?"••••":fm(Math.abs(df))} vs last month</span>`}<div class="st"><div class="stat ic2"><span class="it">${ico("jar")}</span><div><small>Assets</small><b>${M(A)}</b></div></div><div class="stat ic2"><span class="it">${ico("card")}</span><div><small>Liabilities</small><b>${M(L)}</b></div></div></div><p class="t mut" style="text-align:center;margin:0">What you own − what you owe = net worth</p>
 <details class="dt" id="nwd"${U.nwo?" open":""}><summary>Assets and liabilities</summary>${assetGroups()||'<p class="t mut">Add your bank balance, savings, investments, property or vehicle.</p>'}${chips([["aasset","Add an asset"]])}<p class="gh"><span>Liabilities</span><b>${fm(L)}</b></p>${S.debts.length?S.debts.map(d=>info(d.name,d.rate?d.rate+"% interest":"",fm(d.bal),null,"card")).join("")+'<p class="t mut">Edit debts in Goals.</p>':'<p class="t mut">No debts added. Debts you add in Goals appear here.</p>'}<p class="t mut">Goals are money you’ve set aside from your savings, so they are not added on top. Set aside for goals: ${fm(gs)} of ${fm(lq)} in cash and savings.${gs>lq?" Your goals add up to more than the savings you’ve recorded. Update your assets so the numbers match.":""}</p></details>`)}
function cBudget(){const m=ym(),e=expM(m),b=budTotal(),sp=spendM(m),base=b||Math.max(sp,0),p=base?e/base:(e>0?1:0),left=base-e;
 return card(mlab(m)+" budget",`<div class="ringwrap">${leaf("a")}${ring(p,Math.round(p*100)+"%",b?"of budget used":sp>0?"of spendable income used":"set a budget or add income")}${leaf("b")}</div><div class="two"><div><b>${fm(e)}</b><span>spent</span></div><div class="r"><b>${fm(Math.abs(left))}</b><span>${left<0?"over":b?"left in budget":"left to spend"}</span></div></div>`+(b?"":`<p class="t mut" style="text-align:center;margin-bottom:0">Spendable income = income ${fm(incM(m))} − set aside for goals ${fm(savedM(m))}.</p>`))}

async function saveFile(name,data,mime){let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null}catch(e){}
 if(dl){await dl.save({filename:name,data:data});return"saved"}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return"fallback"}

  toast(r==="saved"?"Report ready: "+spec.file:"Report downloaded: "+spec.file+". Check your Downloads folder.")}
 catch(e){toast(e&&e.code==="declined"?"Download cancelled. Nothing was saved.":"Couldn’t create the report: "+((e&&e.message)||"unknown error"))}
 finally{if(btn){btn.disabled=false;btn.textContent=old}}}
